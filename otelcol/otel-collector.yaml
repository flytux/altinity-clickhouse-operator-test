apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: clickhouse
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse-clickhouse.clickhouse.svc:9000
        database: otel
        username: ${env:CLICKHOUSE_USERNAME}
        create_schema: false
        async_insert: true
        compress: lz4
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 10000
          batch:
            min_size: 5000
            flush_timeout: 5s

    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
          exporters:
            - clickhouse
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
          exporters:
            - clickhouse
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
          exporters:
            - clickhouse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: clickhouse
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.164.0
          env:
            - name: CLICKHOUSE_USERNAME
              value: default
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: clickhouse
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
