apiVersion: v1
kind: ConfigMap
metadata:
  name: keeper-root-config
  namespace: clickhouse
data:
  keeper_config.xml: |
    <clickhouse/>
---
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: keeper
  namespace: clickhouse
spec:
  defaults:
    templates:
      podTemplate: keeper-pod
      dataVolumeClaimTemplate: keeper-data
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: 1
  templates:
    podTemplates:
      - name: keeper-pod
        spec:
          volumes:
            - name: keeper-root-config
              configMap:
                name: keeper-root-config
          containers:
            - name: clickhouse-keeper
              image: dhi.io/clickhouse-keeper:26.9
              args:
                - --config-file=/etc/clickhouse-keeper/keeper_config.xml
              volumeMounts:
                - name: keeper-root-config
                  mountPath: /etc/clickhouse-keeper/keeper_config.xml
                  subPath: keeper_config.xml
                - name: keeper-data
                  mountPath: /var/lib/clickhouse
          initContainers:
            - name: init-data-dir
              image: busybox
              command:
                - "sh"
                - "-c"
                - "chown -R 65532:65532 /var/lib/clickhouse"
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: keeper-data
                  mountPath: /var/lib/clickhouse
    volumeClaimTemplates:
      - name: keeper-data
        reclaimPolicy: Retain
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: clickhouse-data
  configuration:
    files:
      config.d/backup_disk.xml: |
        <clickhouse>
          <storage_configuration>
            <disks>
              <backups>
                <type>local</type>
                <path>/backups/</path>
              </backups>
            </disks>
          </storage_configuration>
          <backups>
            <allowed_disk>backups</allowed_disk>
            <allowed_path>/backups/</allowed_path>
          </backups>
        </clickhouse>
    users:
      default/password: clickhouse
      default/networks/ip:
        - 0.0.0.0/0
    zookeeper:
      keeper:
        name: keeper
        namespace: clickhouse
        serviceType: Replicas
    clusters:
      - name: main
        secret:
          auto: "true"
        layout:
          shardsCount: 2
  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          containers:
            - name: clickhouse
              image: dhi.io/clickhouse-server:26.9
              volumeMounts:
                - name: backup-data
                  mountPath: /backups
                - name: clickhouse-data
                  mountPath: /var/lib/clickhouse
          initContainers:
            - name: init-backup-dir
              image: busybox
              command: 
                - "sh"
                - "-c"
                - "chown -R 1001:1001 /backups"
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: backup-data
                  mountPath: /backups
    volumeClaimTemplates:
      - name: clickhouse-data
        reclaimPolicy: Retain
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
      - name: backup-data
        reclaimPolicy: Retain
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
