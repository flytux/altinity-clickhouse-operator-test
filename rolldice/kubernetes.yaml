apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolldice
  namespace: clickhouse
  labels:
    app: rolldice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rolldice
  template:
    metadata:
      labels:
        app: rolldice
    spec:
      containers:
        - name: rolldice
          image: rolldice:new
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.clickhouse.svc:4317
            - name: OTEL_SERVICE_NAME
              value: rolldice
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rolldice
  namespace: clickhouse
spec:
  selector:
    app: rolldice
  ports:
    - name: http
      port: 8080
      targetPort: http
